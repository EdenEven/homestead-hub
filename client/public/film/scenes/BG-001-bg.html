<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BG-001 — Dawn Pasture</title>
<link rel="stylesheet" href="/film/css/animations.css">
</head>
<body class="scene">
<script src="/film/assets/props.js"></script>
<div class="stage" data-screen-label="BG-001 Dawn Pasture">
  <svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dawn pasture with rising sun, mist, trees and distant cows">

    <!-- Sun halo (pulse) + rising sun -->
    <g class="animate-pulse">
      <circle cx="950" cy="240" r="150" fill="var(--gold-light)"></circle>
    </g>
    <use href="#prop-sun" x="878" y="168" width="144" height="144"></use>

    <!-- Far hills -->
    <ellipse cx="170" cy="800" rx="740" ry="270" fill="var(--green-light)" opacity="0.55"></ellipse>
    <ellipse cx="1130" cy="830" rx="840" ry="300" fill="var(--green-light)" opacity="0.7"></ellipse>

    <!-- Mid hill -->
    <ellipse cx="640" cy="930" rx="1000" ry="340" fill="var(--green)"></ellipse>

    <!-- Trees on the mid hill (breathe) -->
    <g transform="translate(150,425)">
      <g class="animate-breathe">
        <use href="#prop-tree" width="140" height="200"></use>
      </g>
    </g>
    <g transform="translate(310,455)">
      <g class="animate-breathe d2">
        <use href="#prop-tree" width="100" height="143" opacity="0.9"></use>
      </g>
    </g>

    <!-- Distant cows on the mid hill -->
    <g transform="translate(760,570)" opacity="0.85">
      <use href="#prop-cow-grazing" width="68" height="44"></use>
    </g>
    <g transform="translate(880,592)" opacity="0.7">
      <use href="#prop-cow-grazing" width="51" height="33"></use>
    </g>

    <!-- Morning mist bands (drift) -->
    <g class="animate-drift slow">
      <rect x="60" y="470" width="560" height="34" rx="17" fill="var(--cream)" opacity="0.55"></rect>
      <rect x="720" y="520" width="420" height="26" rx="13" fill="var(--cream)" opacity="0.45"></rect>
    </g>
    <g class="animate-drift slower d4">
      <rect x="300" y="555" width="640" height="30" rx="15" fill="var(--cream)" opacity="0.5"></rect>
    </g>

    <!-- Foreground hill -->
    <ellipse cx="640" cy="1080" rx="1120" ry="380" fill="var(--green-deep)"></ellipse>

    <!-- Foreground flowers (breathe) -->
    <g transform="translate(136,636)">
      <g class="animate-breathe gentle">
        <use href="#prop-flower" width="28" height="70"></use>
      </g>
    </g>
    <g transform="translate(193,652)">
      <g class="animate-breathe gentle d1">
        <use href="#prop-flower" width="24" height="60" style="--bloom: var(--gold-light)"></use>
      </g>
    </g>
    <g transform="translate(1097,645)">
      <g class="animate-breathe gentle d3">
        <use href="#prop-flower" width="26" height="65"></use>
      </g>
    </g>
  </svg>

  <!-- Layer 3: Golden Hour atmospheric glue (always last) -->
  <div class="sunbeam animate-pulse"></div>
</div>
</body>
</html>
