<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BG-008 — Midnight Gold</title>
<link rel="stylesheet" href="/film/css/animations.css">
</head>
<body class="scene">
<script src="/film/assets/props.js"></script>
<div class="stage" data-screen-label="BG-008 Midnight Gold">
  <svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Deep midnight inversion: a golden moon, gold stars traveling across the sky, fireflies over the dark meadow">

    <!-- Deepest night sky -->
    <rect x="0" y="0" width="1280" height="720" fill="var(--night-deep)"></rect>

    <!-- Traveling star fields (roll across the sky, staggered) -->
    <g transform="translate(0,0)">
      <g class="animate-roll slower">
        <circle cx="40" cy="90" r="5" fill="var(--gold)"></circle>
        <circle cx="180" cy="150" r="4" fill="var(--gold-light)"></circle>
        <circle cx="320" cy="60" r="5" fill="var(--gold)"></circle>
        <circle cx="430" cy="200" r="4" fill="var(--gold-light)"></circle>
      </g>
    </g>
    <g transform="translate(0,40)">
      <g class="animate-roll slower d4">
        <circle cx="80" cy="220" r="4" fill="var(--gold-light)"></circle>
        <circle cx="240" cy="100" r="5" fill="var(--gold)"></circle>
        <circle cx="390" cy="280" r="4" fill="var(--gold-light)"></circle>
      </g>
    </g>
    <g transform="translate(0,20)">
      <g class="animate-roll slower d5">
        <circle cx="60" cy="320" r="4" fill="var(--gold)"></circle>
        <circle cx="220" cy="40" r="4" fill="var(--gold-light)"></circle>
        <circle cx="360" cy="180" r="5" fill="var(--gold)"></circle>
      </g>
    </g>
    <!-- Fixed twinkling stars behind the travelers — two-triangle sparkles -->
    <g class="animate-pulse d2">
      <use href="#prop-star" x="692" y="82" width="16" height="16" style="--star: var(--gold-light)"></use>
      <use href="#prop-star" x="972" y="252" width="15" height="15" style="--star: var(--gold-light)"></use>
      <use href="#prop-star" x="553" y="233" width="13" height="13" style="--star: var(--gold-light)"></use>
    </g>
    <g class="animate-pulse d4">
      <use href="#prop-star" x="840" y="160" width="14" height="14" style="--star: var(--gold)"></use>
      <use href="#prop-star" x="1110" y="90" width="16" height="16" style="--star: var(--gold)"></use>
    </g>

    <!-- Golden gibbous moon, top left (the inversion; glow washes over it) -->
    <g class="animate-drift slow d2">
      <use href="#prop-moon-gibbous" x="150" y="90" width="190" height="190" style="--moon: var(--gold); --moon-sky: var(--night-deep)"></use>
      <g class="animate-pulse">
        <circle cx="245" cy="185" r="150" fill="var(--gold-light)" opacity="0.5"></circle>
      </g>
    </g>

    <!-- Gold horizon glow -->
    <g class="animate-drift slower d1">
      <rect x="240" y="470" width="800" height="30" rx="15" fill="var(--gold)" opacity="0.18"></rect>
    </g>

    <!-- Midnight hills -->
    <ellipse cx="300" cy="870" rx="940" ry="330" fill="var(--night-green)" opacity="0.75"></ellipse>
    <ellipse cx="1000" cy="940" rx="1020" ry="360" fill="var(--night-green)"></ellipse>

    <!-- Tree silhouette, right (breathe) -->
    <g transform="translate(1000,360)">
      <g class="animate-breathe">
        <use href="#prop-tree" width="214" height="306" style="--trunk: var(--earth-deep); --canopy: var(--earth-deep)"></use>
      </g>
    </g>

    <!-- Fireflies over the meadow (pulse, staggered) -->
    <g class="animate-pulse">
      <circle cx="220" cy="600" r="6" fill="var(--gold)"></circle>
      <circle cx="660" cy="650" r="5" fill="var(--gold-light)"></circle>
    </g>
    <g class="animate-pulse d2">
      <circle cx="450" cy="630" r="5" fill="var(--gold-light)"></circle>
      <circle cx="900" cy="615" r="6" fill="var(--gold)"></circle>
    </g>
    <g class="animate-pulse d3">
      <circle cx="80" cy="655" r="5" fill="var(--gold)"></circle>
      <circle cx="1180" cy="640" r="5" fill="var(--gold-light)"></circle>
    </g>

    <!-- Gold-bloom flowers in the dark meadow (breathe) -->
    <g transform="translate(330,640)">
      <g class="animate-breathe gentle d1">
        <use href="#prop-flower" width="28" height="70" style="--stem: var(--night-green); --bloom: var(--gold)"></use>
      </g>
    </g>
    <g transform="translate(780,652)">
      <g class="animate-breathe gentle d4">
        <use href="#prop-flower" width="24" height="60" style="--stem: var(--night-green); --bloom: var(--gold)"></use>
      </g>
    </g>
  </svg>

  <!-- Layer 3: atmospheric glue (always last) — golden midnight haze -->
  <div class="sunbeam animate-pulse"></div>
</div>
</body>
</html>
