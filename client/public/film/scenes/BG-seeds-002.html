<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BG-seeds-002 — The Jar (Fermentation)</title>
<link rel="stylesheet" href="/film/css/animations.css">
</head>
<body class="scene">
<script src="/film/assets/props.js"></script>
<div class="stage" data-screen-label="BG-seeds-002 The Jar">
  <svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Time-lapse: a mason jar of tomato gel and seeds ferments on the windowsill, bubbles rising">

    <!-- Windowsill light, cool glass morning -->
    <rect x="0" y="0" width="1280" height="720" fill="var(--cream)"></rect>
    <rect x="0" y="0" width="1280" height="500" fill="var(--water-light)" opacity="0.22"></rect>

    <!-- Window frame behind the jar -->
    <rect x="330" y="0" width="620" height="430" rx="14" fill="var(--water-light)" opacity="0.5"></rect>
    <rect x="350" y="0" width="580" height="410" rx="10" fill="var(--cream)" opacity="0.7"></rect>
    <line x1="640" y1="0" x2="640" y2="230" stroke="var(--earth-light)" stroke-width="14" opacity="0.6"></line>
    <g class="animate-pulse">
      <circle cx="540" cy="160" r="130" fill="var(--gold-light)" opacity="0.7"></circle>
    </g>

    <!-- Sill / table -->
    <rect x="0" y="500" width="1280" height="220" fill="var(--earth)"></rect>
    <rect x="0" y="500" width="1280" height="26" fill="var(--earth-light)"></rect>
    <ellipse cx="640" cy="608" rx="330" ry="36" fill="var(--earth-deep)" opacity="0.4"></ellipse>

    <!-- The fermentation jar, hero scale -->
    <use href="#prop-jar-mason" x="470" y="130" width="340" height="486" style="--contents: var(--tomato-light); --glass: rgba(169,192,203,0.65); --lid: var(--earth-light)"></use>

    <!-- Neck glass — the shoulder between lid and gel, so the jar reads as one piece -->
    <rect x="512" y="252" width="256" height="74" rx="16" fill="var(--water-light)" opacity="0.8"></rect>
    <rect x="540" y="260" width="10" height="60" rx="5" fill="var(--cream)" opacity="0.7"></rect>

    <!-- Brine layer on top of the gel -->
    <rect x="540" y="320" width="200" height="52" rx="18" fill="var(--water-light)" opacity="0.55"></rect>

    <!-- Seeds suspended in the gel -->
    <use href="#prop-seed" x="566" y="430" width="34" height="25" transform="rotate(24 583 442)"></use>
    <use href="#prop-seed" x="650" y="470" width="34" height="25" transform="rotate(-38 667 482)"></use>
    <use href="#prop-seed" x="600" y="520" width="32" height="23" transform="rotate(60 616 531)"></use>
    <use href="#prop-seed" x="690" y="540" width="30" height="22" transform="rotate(-12 705 551)"></use>
    <use href="#prop-seed" x="558" y="548" width="30" height="22" transform="rotate(40 573 559)"></use>

    <!-- Fermentation bubbles (float) -->
    <g class="animate-float"><circle cx="585" cy="540" r="10" fill="var(--cream)" opacity="0.8"></circle></g>
    <g class="animate-float d1"><circle cx="648" cy="556" r="7" fill="var(--cream)" opacity="0.8"></circle></g>
    <g class="animate-float d2"><circle cx="700" cy="548" r="11" fill="var(--cream)" opacity="0.8"></circle></g>
    <g class="animate-float d3"><circle cx="620" cy="560" r="6" fill="var(--cream)" opacity="0.8"></circle></g>
    <g class="animate-float d4"><circle cx="672" cy="538" r="8" fill="var(--cream)" opacity="0.8"></circle></g>

    <!-- The spent halves, waiting beside -->
    <g transform="translate(890,470)">
      <g class="animate-breathe gentle d2">
        <use href="#prop-tomato" width="130" height="132"></use>
      </g>
    </g>
    <use href="#prop-tomato-half" x="1010" y="488" width="118" height="118"></use>
  </svg>

  <!-- Layer 3: atmospheric glue (always last) -->
  <div class="sunbeam animate-pulse"></div>
</div>
</body>
</html>
