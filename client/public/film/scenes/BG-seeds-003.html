<div class="stage" data-screen-label="BG-seeds-003 The Drying">
  <svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Overhead still: fifty dried tomato seeds scattered across a paper towel, appearing one by one">

    <!-- Overhead: the whole frame is the table -->

    <g opacity="0.3" stroke="var(--earth)" stroke-width="6">
      <line x1="0" y1="120" x2="1280" y2="120"></line>

      <line x1="0" y1="600" x2="1280" y2="600"></line>
    </g>

    <!-- The paper towel -->

    <rect x="220" y="110" width="850" height="510" rx="26" fill="var(--cream)"></rect>
    <rect x="248" y="138" width="794" height="454" rx="18" fill="none" stroke="var(--cream-deep)" stroke-width="4" stroke-dasharray="2 14" opacity="0.9"></rect>
