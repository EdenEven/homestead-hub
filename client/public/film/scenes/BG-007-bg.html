<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BG-007 — Midnight</title>
<link rel="stylesheet" href="/film/css/animations.css">
</head>
<body class="scene">
<script src="/film/assets/props.js"></script>
<div class="stage" data-screen-label="BG-007 Midnight">
  <svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Midnight on the homestead: a glowing moon, saguaros on the hill, and a tall cowboy walking his very small Shetland pony past the sleeping barn">

    <!-- Night sky -->
    <rect x="0" y="0" width="1280" height="720" fill="var(--night)"></rect>

    <!-- Twinkling stars — two-triangle sparkles (pulse, staggered) -->
    <g class="animate-pulse">
      <use href="#prop-star" x="172" y="112" width="18" height="18"></use>
      <use href="#prop-star" x="414" y="74" width="14" height="14" style="--star: var(--gold-light)"></use>
      <use href="#prop-star" x="632" y="162" width="18" height="18"></use>
      <use href="#prop-star" x="754" y="54" width="13" height="13" style="--star: var(--gold-light)"></use>
    </g>
    <g class="animate-pulse d2">
      <use href="#prop-star" x="293" y="213" width="15" height="15" style="--star: var(--gold-light)"></use>
      <use href="#prop-star" x="533" y="293" width="14" height="14"></use>
      <use href="#prop-star" x="1132" y="312" width="17" height="17"></use>
      <use href="#prop-star" x="84" y="324" width="13" height="13" style="--star: var(--gold-light)"></use>
    </g>
    <g class="animate-pulse d3">
      <use href="#prop-star" x="880" y="120" width="15" height="15"></use>
      <use href="#prop-star" x="500" y="140" width="12" height="12" style="--star: var(--gold-light)"></use>
    </g>

    <!-- Moon: white crescent, glowing, top right (drift; glow washes over it) -->
    <g class="animate-drift slow">
      <use href="#prop-moon-crescent" x="940" y="80" width="190" height="190" style="--moon: var(--cream); --moon-sky: var(--night)"></use>
      <g class="animate-pulse">
        <circle cx="1035" cy="175" r="125" fill="var(--cream)" opacity="0.55"></circle>
      </g>
    </g>

    <!-- Night hills -->
    <ellipse cx="980" cy="880" rx="940" ry="330" fill="var(--night-green)" opacity="0.85"></ellipse>
    <ellipse cx="280" cy="940" rx="1020" ry="360" fill="var(--night-green)"></ellipse>

    <!-- Saguaros keeping watch (night blooms open after dark) -->
    <g transform="translate(424,498)" opacity="0.75">
      <use href="#prop-cactus" width="71" height="110" style="--cactus: var(--night-green); --bloom: var(--gold-light)"></use>
    </g>
    <g transform="translate(1066,420)">
      <use href="#prop-cactus" width="113" height="175" opacity="0.9"></use>
    </g>
    <g transform="translate(1186,468)">
      <use href="#prop-cactus" width="84" height="130" opacity="0.8" style="--cactus: var(--night-green)"></use>
    </g>

    <!-- Night mist (drift) -->
    <g class="animate-drift slower d3">
      <rect x="420" y="540" width="560" height="26" rx="13" fill="var(--cream)" opacity="0.18"></rect>
    </g>

    <!-- Barn: three rectangles, bottom left -->
    <g transform="translate(70,500)">
      <use href="#prop-barn-simple" width="280" height="198" style="--barn-wall: var(--earth-deep); --barn-roof: var(--night-deep); --barn-door: var(--gold)"></use>
      <!-- doorway light spill (lantern inside; glow lives in the scene) -->
      <g class="animate-pulse">
        <circle cx="140" cy="153" r="58" fill="var(--gold-light)"></circle>
      </g>
    </g>

    <!-- The midnight walk: a man plainly too big for his Shetland pony -->
    <g transform="translate(742,432)">
      <use href="#prop-cowboy" width="110" height="210"></use>
    </g>
    <!-- Lead rope: from his low hand, sagging, to the halter ring -->
    <line x1="837" y1="561" x2="925" y2="606" stroke="var(--cream-deep)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"></line>
    <line x1="925" y1="606" x2="1018" y2="590" stroke="var(--cream-deep)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"></line>
    <g transform="translate(880,540)">
      <g class="animate-breathe gentle d2">
        <use href="#prop-pony-shetland" width="158" height="105"></use>
      </g>
    </g>
  </svg>

  <!-- Layer 3: atmospheric glue (always last) — moonlight wash at night -->
  <div class="sunbeam sunbeam--moon animate-pulse"></div>
</div>
</body>
</html>
