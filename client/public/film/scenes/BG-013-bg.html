<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BG-013 — Nativity Night</title>
<link rel="stylesheet" href="/film/css/animations.css">
</head>
<body class="scene">
<script src="/film/assets/props.js"></script>
<div class="stage" data-screen-label="BG-013 Nativity Night">
  <svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="The nativity at night: an open-face stable with Mary, Joseph, and the child in the manger, sheep and a donkey nearby, while three wise men on camels cross the foreground following the bright star overhead">

    <!-- Night sky -->
    <rect x="0" y="0" width="1280" height="720" fill="var(--night-deep)"></rect>

    <!-- Scattered stars -->
    <g class="animate-pulse d1"><use href="#prop-star" x="120" y="90" width="12" height="12"></use></g>
    <g class="animate-pulse d3"><use href="#prop-star" x="250" y="180" width="9" height="9"></use></g>
    <g class="animate-pulse d2"><use href="#prop-star" x="820" y="70" width="12" height="12"></use></g>
    <g class="animate-pulse d4"><use href="#prop-star" x="950" y="160" width="10" height="10"></use></g>
    <g class="animate-pulse d5"><use href="#prop-star" x="1100" y="90" width="13" height="13"></use></g>
    <g class="animate-pulse d1"><use href="#prop-star" x="1180" y="230" width="9" height="9"></use></g>
    <g class="animate-pulse d3"><use href="#prop-star" x="90" y="280" width="8" height="8"></use></g>
    <g class="animate-pulse d2"><use href="#prop-star" x="700" y="200" width="9" height="9"></use></g>

    <!-- The nativity star — brightest in the sky, halo and all -->
    <g class="animate-pulse">
      <circle cx="530" cy="105" r="46" fill="var(--gold-light)" opacity="0.3"></circle>
    </g>
    <use href="#prop-star" x="508" y="83" width="44" height="44" style="--star: var(--gold-light)"></use>

    <!-- Its light, falling on the stable -->
    <g class="animate-pulse">
      <polygon points="522,122 538,122 562,345 478,345" fill="var(--gold-light)" opacity="0.15"></polygon>
      <polygon points="526,122 534,122 546,340 494,340" fill="var(--cream)" opacity="0.18"></polygon>
    </g>

    <!-- Bethlehem hills -->
    <ellipse cx="300" cy="850" rx="800" ry="330" fill="var(--night-green)" opacity="0.8"></ellipse>
    <ellipse cx="1050" cy="870" rx="900" ry="330" fill="var(--night-green)" opacity="0.6"></ellipse>

    <!-- The stable, open-faced -->
    <use href="#prop-stable" x="360" y="350" width="320" height="220" style="--wall: var(--night); --roof: var(--earth-deep); --wood: var(--earth)"></use>

    <!-- Warm light inside (glow painted in the scene, per the manifest) -->
    <g class="animate-pulse">
      <ellipse cx="520" cy="490" rx="125" ry="68" fill="var(--gold-light)" opacity="0.25"></ellipse>
    </g>

    <!-- Mary (water-blue robe), the manger, Joseph (earth robe) -->
    <g transform="translate(415,460)">
      <use href="#prop-figure" width="54" height="110" style="--robe: var(--water-deep)"></use>
    </g>
    <use href="#prop-manger" x="470" y="480" width="110" height="90"></use>
    <g transform="translate(582,452)">
      <use href="#prop-figure" width="58" height="118" style="--robe: var(--earth)"></use>
    </g>

    <!-- Near ground -->
    <ellipse cx="640" cy="1040" rx="1200" ry="420" fill="var(--night-green)"></ellipse>

    <!-- The animals of the stable -->
    <g transform="translate(230,545)">
      <g class="animate-breathe gentle d2">
        <use href="#prop-donkey" width="140" height="103"></use>
      </g>
    </g>
    <g transform="translate(700,560)">
      <g class="animate-breathe gentle d1">
        <use href="#prop-sheep" width="95" height="69"></use>
      </g>
    </g>
    <g transform="translate(795,582)">
      <g class="animate-breathe gentle d4">
        <use href="#prop-sheep" width="80" height="58"></use>
      </g>
    </g>

    <!-- The three wise men, riding right-to-left toward the star -->
    <g transform="translate(0,592)">
      <g transform="translate(1280,0) scale(-1,1)">
        <g class="animate-roll slower">
          <use href="#prop-camel" x="0" y="22" width="110" height="78" style="--hide: var(--earth-deep)"></use>
          <use href="#prop-figure" x="30" y="-8" width="30" height="60" style="--robe: var(--gold)"></use>
          <use href="#prop-camel" x="150" y="22" width="110" height="78" style="--hide: var(--earth-deep)"></use>
          <use href="#prop-figure" x="180" y="-8" width="30" height="60" style="--robe: var(--green-deep)"></use>
          <use href="#prop-camel" x="300" y="22" width="110" height="78" style="--hide: var(--earth-deep)"></use>
          <use href="#prop-figure" x="330" y="-8" width="30" height="60" style="--robe: var(--earth-light)"></use>
        </g>
      </g>
    </g>
  </svg>

  <!-- Layer 3: atmospheric glue — cool moonlight wash -->
  <div class="sunbeam sunbeam--moon animate-pulse"></div>
</div>
</body>
</html>
